<!-- templates/add_member.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Member - AJ Fitness</title>
</head>
<body>
    <h1>Add New Member</h1>

    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, message in messages %}
            <li style="color: {% if category == 'error' %}red{% else %}green{% endif %}">
                {{ message }}
            </li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('add_member') }}" method="POST" enctype="multipart/form-data">
        <label for="name">Name:</label><br>
        <input type="text" name="name" id="name" required><br><br>

        <label for="phone">Phone:</label><br>
        <input type="text" name="phone" id="phone" required><br><br>

        <label for="start_date">Start Date:</label><br>
        <input type="date" name="start_date" id="start_date" required><br><br>

        <label for="end_date">End Date:</label><br>
        <input type="date" name="end_date" id="end_date" required><br><br>

        <label for="photo">Upload Photo:</label><br>
        <input type="file" name="photo" id="photo" accept="image/*" required><br><br>

        <button type="submit">Add Member</button>
    </form>
</body>
</html>
